name: release

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: release
    permissions:
      contents: write # the shared workflow pushes the release tag and creates the release
    uses: AmplifiedEngineer/workflows/.github/workflows/release-continuous.yml@b0a902da845646739e117b4ba876d82578e32e5c # v0.1.0
    with:
      files: |
        plugin.json
        .claude-plugin/plugin.json
