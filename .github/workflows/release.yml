name: release

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: release
    permissions:
      contents: write # the shared workflow pushes the release tag and creates the release
    uses: AmplifiedEngineer/workflows/.github/workflows/release-continuous.yml@a68b679eb96b8e30d5cafc63b1cf29c9a44452b6 # v0.2.0
    with:
      files: |
        plugins/ae/plugin.json
        plugins/ae/.claude-plugin/plugin.json
      paths: |
        plugins/ae/skills/
