name: skill evals

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/ae/skills/**"
  workflow_dispatch:
    inputs:
      provider:
        description: Agent runner to evaluate
        type: choice
        options: [claude, codex, both]
        default: both
        required: true
      suite:
        description: Eval suite to run
        type: choice
        options: [plan, implement, review, all]
        default: all
        required: true
      runs:
        description: Runs per case and configuration
        type: number
        default: 3
        required: true
      model:
        description: Optional model override supported by the selected CLI
        type: string
        required: false

permissions:
  contents: read

jobs:
  evals:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install agent CLIs
        run: |
          npm install --global "@anthropic-ai/claude-code@2.1.312" "@openai/codex@0.172.0"

      - name: Run selected evals
        env:
          EVAL_PROVIDER: ${{ inputs.provider || 'both' }}
          EVAL_SUITE: ${{ inputs.suite || 'all' }}
          EVAL_RUNS: ${{ inputs.runs || 3 }}
          EVAL_MODEL: ${{ inputs.model }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: |
          set -euo pipefail

          providers=("$EVAL_PROVIDER")
          if [[ "$EVAL_PROVIDER" == "both" ]]; then providers=(claude codex); fi
          suites=("$EVAL_SUITE")
          if [[ "$EVAL_SUITE" == "all" ]]; then suites=(plan implement review); fi

          if [[ " ${providers[*]} " == *" codex "* ]]; then
            if [[ -z "$CODEX_AUTH_JSON_B64" ]]; then
              echo "Set the CODEX_AUTH_JSON_B64 Actions secret to run Codex evals with ChatGPT sign-in." >&2
              exit 1
            fi
            mkdir -p "$HOME/.codex"
            printf '%s' "$CODEX_AUTH_JSON_B64" | base64 --decode > "$HOME/.codex/auth.json"
            jq -e . "$HOME/.codex/auth.json" >/dev/null
            chmod 600 "$HOME/.codex/auth.json"
          fi

          for provider in "${providers[@]}"; do
            if [[ "$provider" == "claude" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
              echo "Set the CLAUDE_CODE_OAUTH_TOKEN Actions secret to run Claude Code evals." >&2
              exit 1
            fi
            for suite in "${suites[@]}"; do
              args=("$suite" --provider "$provider" --runs "$EVAL_RUNS" --configs "with_skill,baseline")
              if [[ -n "$EVAL_MODEL" ]]; then args+=(--model "$EVAL_MODEL"); fi
              node .github/evals/run.mjs "${args[@]}"
            done
          done
