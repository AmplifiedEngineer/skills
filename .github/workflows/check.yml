name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.312

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show jq version
        run: jq --version

      - name: Repo self-check
        run: sh scripts/check.sh

      # Must stay before the npm install step: cases 20, 21 and 58 need no
      # claude or codex CLI on PATH, and the script's own guard checks that.
      - name: Fault tests for the self-check
        run: sh scripts/test-check.sh

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate plugin manifests
        run: claude plugin validate .

      - name: Install smoke test (Claude Code)
        run: sh scripts/smoke-install.sh claude
