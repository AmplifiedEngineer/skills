# Optional hints file, saved as context.yaml at the document root (default docs/playbook/context.yaml). Written by hand.
# Holds no secrets. A hint is never proof of access.

project:
  name: "example-service"
  repository: "https://example.invalid/org/example-service"
  default_branch: "main"

# For each request type, list order is the ranking: earlier entries are preferred.
sources:
  requirements:
    - "Configured issue tracker"
    - "Approved requirements document"
  architecture:
    - "Repository ADR directory"
    - "Approved design documentation"
  implementation:
    - "Repository source and tests"

integrations:
  issue_tracker:
    provider: "discover from configured tools"
    project_key: "EXAMPLE"
  documentation:
    provider: "discover from configured tools"
    collection: "Example"
